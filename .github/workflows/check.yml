name: Check
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build iPhone app for simulator
        run: xcodebuild -project SipTime.xcodeproj -scheme SipTime -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - name: Test school login window handling
        timeout-minutes: 12
        run: |
          course_simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in groups.items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project SipTime.xcodeproj -scheme SipTime -destination "platform=iOS Simulator,id=$course_simulator_id" -only-testing:SipTimeTests/CourseWebSessionTests CODE_SIGNING_ALLOWED=NO test
        working-directory: ios
